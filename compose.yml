services:
  stw:
    image: ghcr.io/nbaglivo/spread-the-word:latest
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./stw.json:/config/stw.json:ro
      - stw-data:/data

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - stw

volumes:
  stw-data:
  caddy-data:
  caddy-config:
