name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  tag-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nbaglivo/spread-the-word
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag $TAG is not vX.Y.Z"
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tag the deployed image
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null; then
            echo "::error::no image for $GITHUB_SHA; release a commit that was pushed to main and built"
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"
      - name: Add the pull command to the release notes
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          cat > notes.md <<EOF
          $NOTES

          ## Docker image

          \`\`\`bash
          docker pull $IMAGE:$TAG
          \`\`\`

          [All images](https://github.com/nbaglivo/spread-the-word/pkgs/container/spread-the-word)
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
